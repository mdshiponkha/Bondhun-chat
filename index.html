<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bondhu Chat Pro</title>
    
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/134/134914.png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/134/134914.png">
    <meta name="theme-color" content="#0b141a">

    <style>
        :root {
            --bg-dark: #0b141a;
            --header-bg: #202c33;
            --primary-green: #00a884;
            --text-main: #e9edef;
            --msg-me: #005c4b;
            --msg-friend: #202c33;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg-dark); 
            margin: 0; display: flex; flex-direction: column;
            height: 100vh; overflow: hidden;
        }

        /* Splash Screen */
        #splash-screen {
            position: fixed; width: 100%; height: 100%;
            background: #0b141a; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: 0.5s;
        }

        .header {
            background: var(--header-bg); padding: 15px; text-align: center;
            font-weight: bold; color: var(--text-main);
        }

        #video-grid { 
            display: flex; flex-direction: column; gap: 10px; padding: 10px;
            flex: 1; overflow-y: auto; align-items: center;
        }

        video { 
            width: 90%; max-width: 320px; border-radius: 15px; 
            background: #2d2d2d; border: 2px solid #333;
        }

        .mirror { transform: scaleX(-1); }

        .controls-container {
            background: var(--header-bg); padding: 15px;
            border-radius: 25px 25px 0 0;
        }

        .id-bar { font-size: 13px; margin-bottom: 10px; text-align: center; color: #ff9f43; }
        .btn-group { display: flex; gap: 8px; margin-bottom: 10px; position: relative; }
        
        input { 
            flex: 1; padding: 12px; border-radius: 25px;
            border: none; background: #333; color: white; outline: none;
        }

        button { padding: 10px 18px; border-radius: 25px; border: none; font-weight: bold; cursor: pointer; }
        .btn-call { background: var(--primary-green); color: white; }
        .btn-flip { background: #444; color: white; font-size: 11px; }
        .btn-end { background: #dc3545; color: white; }

        #emoji-picker {
            display: none; position: absolute; bottom: 55px; left: 10px;
            background: #2d2d2d; border: 1px solid #444; padding: 10px;
            border-radius: 10px; grid-template-columns: repeat(5, 1fr); gap: 5px; z-index: 100;
        }
        .emoji-item { cursor: pointer; font-size: 20px; }

        #chat-box {
            height: 80px; background: rgba(0,0,0,0.2); margin-bottom: 10px;
            padding: 10px; overflow-y: auto; border-radius: 15px;
            display: flex; flex-direction: column;
        }

        .msg { padding: 8px 15px; border-radius: 15px; margin-bottom: 5px; max-width: 80%; font-size: 14px; color: white; }
        .my-msg { background: var(--msg-me); align-self: flex-end; }
        .friend-msg { background: var(--msg-friend); align-self: flex-start; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="https://cdn-icons-png.flaticon.com/512/134/134914.png" width="80" alt="Logo">
        <h2 style="color: #00a884;">Bondhu Chat Pro</h2>
        <div style="border: 4px solid #f3f3f3; border-top: 4px solid #00a884; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite;"></div>
        <button id="install-btn" style="display:none; margin-top:20px; background:var(--primary-green); color:white;">অ্যাপটি ইনস্টল করুন</button>
    </div>

    <div class="header">Bondhu Chat Pro</div>

    <div id="video-grid">
        <video id="localVideo" class="mirror" autoplay muted playsinline></video>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <div class="controls-container">
        <div class="id-bar">
            আইডি: <strong id="my-id">...</strong>
            <button onclick="copyId()" style="background:#444; color:white; padding:2px 8px;">কপি</button>
            <button class="btn-flip" onclick="flipCamera()">🔄 ক্যামেরা</button>
            <button onclick="shareWA()" style="background:#25D366; color:white; padding:2px 8px; font-size:10px; border-radius:5px;">WA Share</button>
        </div>

        <div class="btn-group">
            <input type="text" id="friend-id" placeholder="বন্ধুর আইডি">
            <button class="btn-call" onclick="connectToFriend()">কল</button>
            <button class="btn-end" onclick="endCall()">শেষ</button>
        </div>

        <div id="chat-box"></div>

        <div class="btn-group">
            <div id="emoji-picker">
                <span class="emoji-item" onclick="addEmoji('😊')">😊</span>
                <span class="emoji-item" onclick="addEmoji('😂')">😂</span>
                <span class="emoji-item" onclick="addEmoji('❤️')">❤️</span>
                <span class="emoji-item" onclick="addEmoji('👍')">👍</span>
                <span class="emoji-item" onclick="addEmoji('👋')">👋</span>
                <span class="emoji-item" onclick="addEmoji('🙏')">🙏</span>
            </div>
            <button onclick="toggleEmoji()" style="background:#444;">😊</button>
            <input type="text" id="msg-input" placeholder="মেসেজ...">
            <button class="btn-call" onclick="sendMessage()">পাঠান</button>
        </div>
    </div>

    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script>
        const peer = new Peer();
        let localStream, currentCall, currentConn, useFrontCamera = true;

        async function startCamera(isFront) {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            const constraints = { video: { facingMode: isFront ? "user" : "environment" }, audio: true };
            try {
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('localVideo').srcObject = localStream;
                isFront ? document.getElementById('localVideo').classList.add('mirror') : document.getElementById('localVideo').classList.remove('mirror');
                if (currentCall) {
                    const videoTrack = localStream.getVideoTracks()[0];
                    const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'video');
                    sender.replaceTrack(videoTrack);
                }
            } catch (err) { alert("ক্যামেরা অন করুন!"); }
        }

        startCamera(true);
        function flipCamera() { useFrontCamera = !useFrontCamera; startCamera(useFrontCamera); }

        peer.on('open', id => { document.getElementById('my-id').innerText = id; });
        peer.on('call', call => {
            currentCall = call; call.answer(localStream);
            call.on('stream', rs => { document.getElementById('remoteVideo').srcObject = rs; });
        });
        peer.on('connection', conn => { currentConn = conn; setupChat(); });

        function connectToFriend() {
            const fId = document.getElementById('friend-id').value;
            if(!fId) return alert("আইডি দিন!");
            currentCall = peer.call(fId, localStream);
            currentCall.on('stream', rs => { document.getElementById('remoteVideo').srcObject = rs; });
            currentConn = peer.connect(fId); setupChat();
        }

        function setupChat() { currentConn.on('data', data => appendMsg(data, 'friend-msg')); }
        function sendMessage() {
            const m = document.getElementById('msg-input').value;
            if (m && currentConn) {
                currentConn.send(m); appendMsg(m, 'my-msg');
                document.getElementById('msg-input').value = '';
                document.getElementById('emoji-picker').style.display = 'none';
            }
        }
        function appendMsg(m, t) {
            const b = document.getElementById('chat-box');
            const d = document.createElement('div');
            d.className = 'msg ' + t; d.innerText = m;
            b.appendChild(d); b.scrollTop = b.scrollHeight;
        }

        function toggleEmoji() {
            const p = document.getElementById('emoji-picker');
            p.style.display = p.style.display === 'grid' ? 'none' : 'grid';
        }
        function addEmoji(e) { document.getElementById('msg-input').value += e; }
        function copyId() { navigator.clipboard.writeText(document.getElementById('my-id').innerText); alert("কপি হয়েছে!"); }
        function shareWA() { window.open("https://wa.me/?text=" + encodeURIComponent("আইডি: " + document.getElementById('my-id').innerText)); }
        function endCall() { if(currentCall) currentCall.close(); if(currentConn) currentConn.close(); document.getElementById('remoteVideo').srcObject = null; }

        // Splash Screen & Install Logic
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault(); deferredPrompt = e;
            document.getElementById('install-btn').style.display = 'block';
        });

        document.getElementById('install-btn').addEventListener('click', () => {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choice) => {
                if (choice.outcome === 'accepted') document.getElementById('install-btn').style.display = 'none';
            });
        });

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('splash-screen').style.opacity = '0';
                setTimeout(() => { document.getElementById('splash-screen').style.display = 'none'; }, 500);
            }, 2500);
        };
    </script>
</body>
</html>
